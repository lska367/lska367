name: Activity Signal

# Regenerates assets/activity-signal*.svg (contribution line chart + stats +
# language bar) from the GitHub APIs. Nothing third-party renders the image, so
# a dead public instance can never break the profile; if a run fails, the last
# good SVG stays committed.

on:
  schedule:
    - cron: "20 23 * * *" # daily 23:20 UTC, after GitHub settles the day's counters
  workflow_dispatch: {}
  push:
    paths:
      - scripts/render_activity_signal.py
      - .github/workflows/activity-signal.yml

permissions:
  contents: write

concurrency:
  group: activity-signal
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render charts
        env:
          GITHUB_TOKEN: ${{ github.token }} # raises rate limits; enables the GraphQL source
        run: |
          python scripts/render_activity_signal.py --username lska367 --lang en --out assets/activity-signal.svg
          python scripts/render_activity_signal.py --username lska367 --lang zh --out assets/activity-signal-zh.svg

      - name: Commit refreshed SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets; then
            echo "charts unchanged, nothing to commit"
            exit 0
          fi
          git add assets
          git commit -m "chore(activity-signal): refresh charts [skip ci]"
          git push
